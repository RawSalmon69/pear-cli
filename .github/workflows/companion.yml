name: Companion

on:
  push:
    branches: [main]
    paths: ["companion/**"]
  pull_request:
    paths: ["companion/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # `build.sh` compiles the bundled `analyze-go` helper, so this job needs Go
      # exactly like the release job does. Without it the assemble step dies with
      # `go: command not found` — which is how the size gate added in 2.15.0
      # managed to fail on every push while the release workflow stayed green.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build
        working-directory: companion
        run: swift build

      - name: Test
        working-directory: companion
        run: swift test

      - name: Assemble app bundle
        working-directory: companion
        run: ./build.sh

      # Same 20 MB budget the release workflow enforces. It used to run ONLY on a
      # `companion-v*` tag, so a change that bloated the bundle was already on
      # main before anyone found out.
      - name: Check bundle size budget
        run: |
          set -euo pipefail
          APP="companion/build/Pear.app"
          SIZE_MB=$(( $(du -sk "$APP" | cut -f1) / 1024 ))
          echo "Bundle size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 20 ]; then
            echo "::error::Bundle ${SIZE_MB} MB exceeds the 20 MB budget"
            exit 1
          fi
